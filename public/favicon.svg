<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- 渐变背景 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    
    <!-- 文档渐变 -->
    <linearGradient id="docGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:0.9" />
    </linearGradient>
    
    <!-- 阴影滤镜 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 背景圆角矩形 -->
  <rect width="100" height="100" fill="url(#bgGradient)" rx="20"/>
  
  <!-- 文档图标 -->
  <g filter="url(#shadow)">
    <!-- 文档主体 -->
    <path d="M 28 21 L 52 21 L 72 35 L 72 79 L 28 79 Z" 
          fill="url(#docGradient)" 
          stroke="#ffffff" 
          stroke-width="2"/>
    
    <!-- 文档折角 -->
    <path d="M 52 21 L 52 35 L 72 35" 
          fill="#e0e0e0" 
          stroke="#ffffff" 
          stroke-width="1"/>
    
    <!-- M 字母 -->
    <text x="35" y="52" font-size="15" fill="#667eea" font-family="Arial, sans-serif" font-weight="bold">M</text>
    
    <!-- D 字母 -->
    <text x="51" y="52" font-size="15" fill="#764ba2" font-family="Arial, sans-serif" font-weight="bold">D</text>
    
    <!-- 分隔线 -->
    <line x1="34" y1="59" x2="66" y2="59" stroke="#e0e0e0" stroke-width="1"/>
    
    <!-- Markdown 符号 -->
    <!-- 井号 -->
    <text x="34" y="72" font-size="9" fill="#667eea" font-family="monospace" font-weight="bold">#</text>
    
    <!-- 代码括号 -->
    <text x="43" y="72" font-size="8" fill="#764ba2" font-family="monospace" font-weight="bold">&lt;/&gt;</text>
    
    <!-- 星号 -->
    <text x="55" y="72" font-size="9" fill="#9c27b0" font-family="monospace" font-weight="bold">*</text>
  </g>
  
  <!-- 装饰性元素 -->
  <circle cx="78" cy="22" r="4" fill="#ffffff" opacity="0.6"/>
  <circle cx="22" cy="78" r="3" fill="#ffffff" opacity="0.4"/>
</svg>
