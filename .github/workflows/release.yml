name: Create Release

on:
    push:
        tags:
            - 'v[0-9]+.[0-9]+.[0-9]+'
            - 'v[0-9]+.[0-9]+.[0-9]+-preview.[0-9]+'

permissions:
    contents: write

# 确保同一 tag 只有一个工作流运行
concurrency:
    group: release-${{ github.ref_name }}
    cancel-in-progress: false

jobs:
    build:
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: 'macos-latest'
                      args: '--target universal-apple-darwin'
                    - platform: 'ubuntu-22.04'
                      args: ''
                    - platform: 'windows-latest'
                      args: ''

        runs-on: ${{ matrix.platform }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

            - name: Rust cache
              uses: swatinem/rust-cache@v2
              with:
                  workspaces: './tauri -> target'

            - name: Install dependencies (Ubuntu only)
              if: matrix.platform == 'ubuntu-22.04'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

            - name: Install frontend dependencies
              run: npm ci

            - name: Build Tauri app
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NODE_OPTIONS: --max-old-space-size=4096
              with:
                  args: ${{ matrix.args }}

            - name: Upload artifacts (Windows)
              if: matrix.platform == 'windows-latest'
              uses: actions/upload-artifact@v4
              with:
                  name: artifacts-windows
                  path: |
                      tauri/target/release/bundle/nsis/*.exe
                      tauri/target/release/bundle/msi/*.msi
                  if-no-files-found: ignore
                  retention-days: 1

            - name: Upload artifacts (Ubuntu)
              if: matrix.platform == 'ubuntu-22.04'
              uses: actions/upload-artifact@v4
              with:
                  name: artifacts-linux
                  path: |
                      tauri/target/release/bundle/deb/*.deb
                      tauri/target/release/bundle/appimage/*.AppImage
                  if-no-files-found: ignore
                  retention-days: 1

            - name: Upload artifacts (macOS)
              if: matrix.platform == 'macos-latest'
              uses: actions/upload-artifact@v4
              with:
                  name: artifacts-macos
                  path: |
                      tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
                      tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
                  if-no-files-found: ignore
                  retention-days: 1

    release:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Download all artifacts
              uses: actions/download-artifact@v4
              with:
                  path: artifacts
                  merge-multiple: true

            - name: Generate release notes
              id: release_notes
              shell: bash
              run: |
                  CURRENT_TAG=${{ github.ref_name }}
                  PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${CURRENT_TAG}$" | head -1)
                  if [ -z "$PREV_TAG" ]; then
                      echo "notes=Initial release" >> $GITHUB_OUTPUT
                  else
                      NOTES=$(git log --pretty=format:"- %s" ${PREV_TAG}..${CURRENT_TAG} | head -20)
                      echo "notes<<EOF" >> $GITHUB_OUTPUT
                      echo "$NOTES" >> $GITHUB_OUTPUT
                      echo "EOF" >> $GITHUB_OUTPUT
                  fi

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  name: 'Markdown Editor ${{ github.ref_name }}'
                  body: |
                      ## Markdown Editor ${{ github.ref_name }}

                      ### 📦 变更内容
                      ${{ steps.release_notes.outputs.notes }}

                      ### ✨ 功能特性
                      - 实时 Markdown 预览
                      - 语法高亮
                      - 数学公式支持 (KaTeX)
                      - 流程图支持 (Mermaid)
                      - 搜索与替换
                      - 本地存储

                      ### 📥 下载说明
                      - **Windows**: 下载 `.msi` 或 `.exe` 安装包
                      - **macOS**: 下载 `.dmg` 安装包 (支持 Intel 和 Apple Silicon)
                      - **Linux**: 下载 `.deb` 或 `.AppImage`
                  files: artifacts/**/*
                  draft: false
                  prerelease: false
                  fail_on_unmatched_files: false
