<!doctype html>
<html lang="zh-CN" dir="ltr">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <meta name="referrer" content="no-referrer" />
        <meta
            name="description"
            content="功能强大的在线 Markdown 编辑器，支持实时预览、语法高亮、数学公式、流程图等"
        />
        <meta name="keywords" content="Markdown,编辑器,在线编辑,实时预览,语法高亮" />
        <meta name="author" content="Markdown" />
        <meta name="theme-color" id="theme-color" content="#ffffff" />
        <title>Markdown</title>
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="stylesheet" href="/src/styles/markdown.css" />
    </head>

    <body>
        <!-- Status Display -->
        <div class="status-overlay" id="status-overlay"></div>
        <div class="status-message" id="status-message"></div>

        <!-- Sidebar Overlay (for mobile) -->
        <div class="md-sidebar-overlay" id="md-sidebar-overlay"></div>

        <!-- Main Layout Container - 横向布局 -->
        <div class="md-main-layout">
            <!-- Left Sidebar - Project Management -->
            <aside class="md-sidebar md-sidebar-left" id="md-sidebar-left">
                <div class="md-sidebar-header">
                    <div class="md-sidebar-toolbar" role="toolbar" aria-label="文档管理工具栏">
                        <button
                            class="md-btn md-btn-icon"
                            id="md-new-file"
                            title="新建文件"
                            aria-label="新建文件"
                        >
                            <i class="codicon codicon-new-file" aria-hidden="true"></i>
                        </button>
                        <button
                            class="md-btn md-btn-icon"
                            id="md-new-folder"
                            title="新建目录"
                            aria-label="新建目录"
                        >
                            <i class="codicon codicon-new-folder" aria-hidden="true"></i>
                        </button>
                        <button
                            class="md-btn md-btn-icon"
                            id="md-import-docs"
                            title="导入文档"
                            aria-label="导入文档"
                        >
                            <i class="codicon codicon-sign-in md-icon-rotate-90" aria-hidden="true"></i>
                        </button>
                        <button
                            class="md-btn md-btn-icon"
                            id="md-export-docs"
                            title="导出文档"
                            aria-label="导出文档"
                        >
                            <i class="codicon codicon-sign-out md-icon-rotate-90" aria-hidden="true"></i>
                        </button>
                        <button
                            class="md-btn md-btn-icon"
                            id="md-delete-item"
                            title="清空所有文件"
                            aria-label="清空所有文件"
                        >
                            <i class="codicon codicon-clear-all" aria-hidden="true"></i>
                        </button>
                    </div>
                    <button
                        class="md-btn md-btn-icon md-btn-ghost"
                        id="md-close-left-sidebar"
                        title="关闭侧边栏"
                    >
                        <i class="codicon codicon-close"></i>
                    </button>
                </div>
                <div class="md-sidebar-content">
                    <nav
                        class="md-doc-tree"
                        id="md-doc-tree"
                        role="navigation"
                        aria-label="文档树"
                    >
                        <!-- Document tree will be generated dynamically -->
                    </nav>
                </div>
            </aside>

            <!-- Middle Area - Toolbar + Container 垂直布局 -->
            <div class="md-middle-area">
                <!-- Top Toolbar -->
                <div class="md-toolbar">
                    <div class="md-toolbar-left">
                        <button
                            class="md-btn md-btn-icon md-btn-ghost"
                            id="md-toggle-left-sidebar"
                            title="项目管理"
                            aria-label="切换项目管理侧边栏"
                            aria-pressed="false"
                        >
                            <i class="codicon codicon-folder-library" aria-hidden="true"></i>
                        </button>
                        <button
                            class="md-btn md-btn-icon md-btn-ghost"
                            id="md-layout-toggle"
                            title="切换布局"
                            aria-label="切换编辑器布局"
                        >
                            <i class="codicon codicon-layout" aria-hidden="true"></i>
                        </button>
                        <button
                            class="md-btn md-btn-icon md-btn-ghost"
                            id="md-sync-scroll"
                            title="同步滚动"
                            aria-label="切换同步滚动"
                            aria-pressed="true"
                        >
                            <i class="codicon codicon-sync" aria-hidden="true"></i>
                        </button>
                    </div>
                    <div class="md-toolbar-right">
                        <button
                            class="md-btn md-btn-icon md-btn-ghost"
                            id="md-search-toggle-btn"
                            title="搜索 (Ctrl+F)"
                            aria-label="打开搜索面板"
                        >
                            <i class="codicon codicon-search" aria-hidden="true"></i>
                        </button>
                        <button
                            class="md-btn md-btn-icon md-btn-ghost"
                            id="theme-toggle"
                            title="切换主题"
                            aria-label="切换深色/浅色主题"
                        >
                            <i class="codicon codicon-color-mode" aria-hidden="true"></i>
                        </button>
                        <button
                            class="md-btn md-btn-icon md-btn-ghost"
                            id="md-settings-btn"
                            title="设置"
                            aria-label="打开设置"
                        >
                            <i class="codicon codicon-settings-gear" aria-hidden="true"></i>
                        </button>
                        <button
                            class="md-btn md-btn-icon md-btn-ghost"
                            id="md-toggle-right-sidebar"
                            title="功能面板"
                            aria-label="切换功能面板"
                            aria-pressed="false"
                        >
                            <i class="codicon codicon-menu" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                <!-- Main Container -->
                <div class="md-container" id="md-container">
                    <!-- Editor Pane -->
                    <div class="md-pane md-editor-pane" id="md-editor-pane">
                        <div id="markdown-editor"></div>
                    </div>

                    <!-- Divider -->
                    <div class="md-divider" id="md-divider"></div>

                    <!-- Preview Pane -->
                    <div class="md-pane md-preview-pane" id="md-preview-pane">
                        <div
                            class="md-preview-scroll unified-scrollbar"
                            id="md-preview-wrapper"
                        >
                            <div
                                id="markdown-preview"
                                class="markdown-body"
                                role="article"
                                aria-label="Markdown 预览区域"
                                aria-live="polite"
                            ></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Sidebar - Tools -->
            <aside class="md-sidebar md-sidebar-right" id="md-sidebar-right">
                <div class="md-sidebar-header">
                    <div class="md-sidebar-tools" role="tablist" aria-label="工具">
                        <button
                            class="md-btn md-btn-icon md-btn-ghost md-sidebar-tool active"
                            data-section="toc"
                            title="目录"
                            aria-label="目录"
                            aria-pressed="true"
                        >
                            <i class="codicon codicon-list-tree" aria-hidden="true"></i>
                        </button>
                        <button
                            class="md-btn md-btn-icon md-btn-ghost md-sidebar-tool"
                            data-section="export"
                            title="导出"
                            aria-label="导出"
                            aria-pressed="false"
                        >
                            <i class="codicon codicon-export" aria-hidden="true"></i>
                        </button>
                    </div>
                    <button
                        class="md-btn md-btn-icon md-btn-ghost"
                        id="md-close-right-sidebar"
                        title="关闭侧边栏"
                    >
                        <i class="codicon codicon-close"></i>
                    </button>
                </div>
                <div class="md-sidebar-content">
                    <!-- TOC Section -->
                    <div
                        class="md-sidebar-section md-sidebar-section-toc"
                        id="md-toc-section"
                        data-section="toc"
                    >
                        <div class="md-sidebar-section-header">
                            <button
                                class="md-sidebar-section-toggle"
                                data-section="toc"
                                title="折叠/展开"
                            >
                                <i class="codicon codicon-chevron-right"></i>
                            </button>
                            <span class="md-sidebar-section-title">目录</span>
                        </div>
                        <div class="md-sidebar-section-content" id="md-toc-content">
                            <div class="md-toc" id="md-toc">
                                <!-- TOC will be generated dynamically -->
                            </div>
                        </div>
                    </div>

                    <!-- Export Section -->
                    <div
                        class="md-sidebar-section md-sidebar-section-export"
                        id="md-export-section"
                        data-section="export"
                    >
                        <div class="md-sidebar-section-header">
                            <button
                                class="md-sidebar-section-toggle"
                                data-section="export"
                                title="折叠/展开"
                            >
                                <i class="codicon codicon-chevron-right"></i>
                            </button>
                            <span class="md-sidebar-section-title">导出</span>
                        </div>
                        <div class="md-sidebar-section-content" id="md-export-content">
                            <div class="md-btn-group">
                                <button class="md-btn md-btn-block" id="md-export-html">
                                    导出 HTML
                                </button>
                                <button class="md-btn md-btn-block" id="md-export-md">
                                    导出 Markdown
                                </button>
                                <button class="md-btn md-btn-block" id="md-export-pdf">
                                    导出 PDF
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </aside>
        </div>

        <!-- Settings Dialog -->
        <div class="md-settings-overlay" id="md-settings-overlay">
            <div class="md-settings-dialog">
                <div class="md-settings-header">
                    <h2>设置</h2>
                    <button class="md-btn md-btn-icon md-btn-ghost" id="md-settings-close" title="关闭">
                        <i class="codicon codicon-close"></i>
                    </button>
                </div>
                <div class="md-settings-content">
                    <!-- Left Navigation -->
                    <div class="md-settings-nav unified-scrollbar">
                        <div class="md-settings-nav-item active" data-section="interface" title="界面">
                            <i class="codicon codicon-layout md-settings-nav-item-icon"></i>
                            <span class="md-settings-nav-item-text">界面</span>
                        </div>
                        <div class="md-settings-nav-item" data-section="editor" title="编辑器">
                            <i class="codicon codicon-settings-gear md-settings-nav-item-icon"></i>
                            <span class="md-settings-nav-item-text">编辑器</span>
                        </div>
                        <div class="md-settings-nav-item" data-section="export" title="导出">
                            <i class="codicon codicon-export md-settings-nav-item-icon"></i>
                            <span class="md-settings-nav-item-text">导出</span>
                        </div>
                    </div>
                    <!-- Right Content -->
                    <div class="md-settings-body unified-scrollbar">
                        <!-- Interface Settings -->
                        <div class="md-settings-section active" id="settings-interface">
                            <div class="md-settings-group">
                                <h4>主题设置</h4>
                                <div class="md-settings-item">
                                    <label class="md-settings-label">
                                        <span>主题模式</span>
                                        <span class="md-settings-description">选择界面主题</span>
                                    </label>
                                    <div class="md-settings-control">
                                        <select id="setting-theme">
                                            <option value="light">浅色主题</option>
                                            <option value="dark">深色主题</option>
                                            <option value="auto">跟随系统</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="md-settings-group">
                                <h4>布局设置</h4>
                                <div class="md-settings-item">
                                    <label class="md-settings-label">
                                        <span>布局模式</span>
                                        <span class="md-settings-description">选择编辑器布局模式</span>
                                    </label>
                                    <div class="md-settings-control">
                                        <select id="setting-layout">
                                            <option value="layout-both">双栏布局</option>
                                            <option value="layout-editor-only">仅编辑</option>
                                            <option value="layout-preview-only">仅预览</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="md-settings-item">
                                    <label class="md-settings-label">
                                        <span>编辑器宽度比例</span>
                                        <span class="md-settings-description">调整编辑器与预览的宽度比例</span>
                                    </label>
                                    <div class="md-settings-control">
                                        <input type="range" id="setting-left-ratio" value="50" min="20" max="80" step="5" />
                                        <span class="md-settings-value" id="setting-left-ratio-value">50%</span>
                                    </div>
                                </div>
                                <div class="md-settings-item">
                                    <label class="md-settings-label">
                                        <span>同步滚动</span>
                                        <span class="md-settings-description">编辑器与预览窗口同步滚动</span>
                                    </label>
                                    <div class="md-settings-control">
                                        <label class="md-switch">
                                            <input type="checkbox" id="setting-sync-scroll-enabled" checked />
                                            <span class="md-switch-slider"></span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                            <div class="md-settings-group">
                                <h4>侧边栏设置</h4>
                                <div class="md-settings-item">
                                    <label class="md-settings-label">
                                        <span>默认打开左侧边栏</span>
                                        <span class="md-settings-description">启动时自动打开左侧边栏</span>
                                    </label>
                                    <div class="md-settings-control">
                                        <label class="md-switch">
                                            <input type="checkbox" id="setting-left-sidebar-open" />
                                            <span class="md-switch-slider"></span>
                                        </label>
                                    </div>
                                </div>
                                <div class="md-settings-item">
                                    <label class="md-settings-label">
                                        <span>默认打开右侧边栏</span>
                                        <span class="md-settings-description">启动时自动打开右侧边栏</span>
                                    </label>
                                    <div class="md-settings-control">
                                        <label class="md-switch">
                                            <input type="checkbox" id="setting-right-sidebar-open" />
                                            <span class="md-switch-slider"></span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- Editor Settings -->
                        <div class="md-settings-section" id="settings-editor">
                            <div class="md-settings-group">
                                <h4>通用设置</h4>
                                <div class="md-settings-item">
                                    <label class="md-settings-label">
                                        <span>编辑器类型</span>
                                        <span class="md-settings-description">选择编辑器引擎</span>
                                    </label>
                                    <div class="md-settings-control">
                                        <select id="setting-editor-type">
                                            <option value="codemirror">CodeMirror</option>
                                            <option value="monaco">Monaco</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="md-settings-item">
                                    <label class="md-settings-label">
                                        <span>字体大小</span>
                                        <span class="md-settings-description">留空使用浏览器默认值（通常为16px）</span>
                                    </label>
                                    <div class="md-settings-control">
                                        <input type="number" id="setting-font-size" placeholder="默认" min="10" max="24" />
                                        <span class="md-settings-unit">px</span>
                                    </div>
                                </div>
                                <div class="md-settings-item">
                                    <label class="md-settings-label">
                                        <span>行高</span>
                                        <span class="md-settings-description">设置编辑器行高</span>
                                    </label>
                                    <div class="md-settings-control">
                                        <input type="number" id="setting-line-height" value="1.6" min="1.0" max="2.5" step="0.1" />
                                    </div>
                                </div>
                                <div class="md-settings-item">
                                    <label class="md-settings-label">
                                        <span>自动保存</span>
                                        <span class="md-settings-description">编辑时自动保存文档</span>
                                    </label>
                                    <div class="md-settings-control">
                                        <label class="md-switch">
                                            <input type="checkbox" id="setting-auto-save" checked />
                                            <span class="md-switch-slider"></span>
                                        </label>
                                    </div>
                                </div>
                                <div class="md-settings-item">
                                    <label class="md-settings-label">
                                        <span>使用空格代替 TAB</span>
                                        <span class="md-settings-description">按 TAB 键时插入空格而非制表符</span>
                                    </label>
                                    <div class="md-settings-control">
                                        <label class="md-switch">
                                            <input type="checkbox" id="setting-insert-spaces" checked />
                                            <span class="md-switch-slider"></span>
                                        </label>
                                    </div>
                                </div>
                                <div class="md-settings-item">
                                    <label class="md-settings-label">
                                        <span>TAB 大小</span>
                                        <span class="md-settings-description">TAB 键对应的空格数量</span>
                                    </label>
                                    <div class="md-settings-control">
                                        <input type="number" id="setting-tab-size" value="4" min="2" max="8" />
                                        <span class="md-settings-unit">空格</span>
                                    </div>
                                </div>
                                <div class="md-settings-item">
                                    <label class="md-settings-label">
                                        <span>自动换行</span>
                                        <span class="md-settings-description">超出宽度时自动换行</span>
                                    </label>
                                    <div class="md-settings-control">
                                        <label class="md-switch">
                                            <input type="checkbox" id="setting-word-wrap" checked />
                                            <span class="md-switch-slider"></span>
                                        </label>
                                    </div>
                                </div>
                                <div class="md-settings-item">
                                    <label class="md-settings-label">
                                        <span>高亮当前行</span>
                                        <span class="md-settings-description">高亮显示光标所在行</span>
                                    </label>
                                    <div class="md-settings-control">
                                        <label class="md-switch">
                                            <input type="checkbox" id="setting-highlight-active-line" checked />
                                            <span class="md-switch-slider"></span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                            <div class="md-settings-group" id="settings-codemirror-group">
                                <h4>CodeMirror 设置</h4>
                                <div class="md-settings-item">
                                    <label class="md-settings-label">
                                        <span>显示行号</span>
                                        <span class="md-settings-description">在编辑器左侧显示行号</span>
                                    </label>
                                    <div class="md-settings-control">
                                        <label class="md-switch">
                                            <input type="checkbox" id="setting-cm-line-numbers" checked />
                                            <span class="md-switch-slider"></span>
                                        </label>
                                    </div>
                                </div>
                                <div class="md-settings-item">
                                    <label class="md-settings-label">
                                        <span>括号匹配</span>
                                        <span class="md-settings-description">自动匹配括号、引号等</span>
                                    </label>
                                    <div class="md-settings-control">
                                        <label class="md-switch">
                                            <input type="checkbox" id="setting-cm-bracket-matching" checked />
                                            <span class="md-switch-slider"></span>
                                        </label>
                                    </div>
                                </div>
                                <div class="md-settings-item">
                                    <label class="md-settings-label">
                                        <span>显示空白符</span>
                                        <span class="md-settings-description">显示空格、制表符等空白字符</span>
                                    </label>
                                    <div class="md-settings-control">
                                        <label class="md-switch">
                                            <input type="checkbox" id="setting-cm-render-whitespace" />
                                            <span class="md-switch-slider"></span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                            <div class="md-settings-group" id="settings-monaco-group">
                                <h4>Monaco 设置</h4>
                                <div class="md-settings-item">
                                    <label class="md-settings-label">
                                        <span>显示小地图</span>
                                        <span class="md-settings-description">在编辑器右侧显示代码缩略图</span>
                                    </label>
                                    <div class="md-settings-control">
                                        <label class="md-switch">
                                            <input type="checkbox" id="setting-monaco-minimap" checked />
                                            <span class="md-switch-slider"></span>
                                        </label>
                                    </div>
                                </div>
                                <div class="md-settings-item">
                                    <label class="md-settings-label">
                                        <span>括号配对着色</span>
                                        <span class="md-settings-description">为匹配的括号对显示不同颜色</span>
                                    </label>
                                    <div class="md-settings-control">
                                        <label class="md-switch">
                                            <input type="checkbox" id="setting-monaco-bracket-pair-colorization" checked />
                                            <span class="md-switch-slider"></span>
                                        </label>
                                    </div>
                                </div>
                                <div class="md-settings-item">
                                    <label class="md-settings-label">
                                        <span>光标闪烁动画</span>
                                        <span class="md-settings-description">设置光标闪烁效果</span>
                                    </label>
                                    <div class="md-settings-control">
                                        <select id="setting-monaco-cursor-blinking">
                                            <option value="blink">闪烁</option>
                                            <option value="smooth">平滑</option>
                                            <option value="phase">相位</option>
                                            <option value="expand">展开</option>
                                            <option value="solid">实心</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="md-settings-item">
                                    <label class="md-settings-label">
                                        <span>平滑滚动</span>
                                        <span class="md-settings-description">启用平滑滚动效果</span>
                                    </label>
                                    <div class="md-settings-control">
                                        <label class="md-switch">
                                            <input type="checkbox" id="setting-monaco-smooth-scrolling" checked />
                                            <span class="md-switch-slider"></span>
                                        </label>
                                    </div>
                                </div>
                                <div class="md-settings-item">
                                    <label class="md-settings-label">
                                        <span>显示空白符</span>
                                        <span class="md-settings-description">显示空格、制表符等空白字符</span>
                                    </label>
                                    <div class="md-settings-control">
                                        <select id="setting-monaco-render-whitespace">
                                            <option value="none">关闭</option>
                                            <option value="selection">仅选中</option>
                                            <option value="all">始终</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- Export Settings -->
                        <div class="md-settings-section" id="settings-export">
                            <div class="md-settings-group">
                                <h4>HTML 导出</h4>
                                <div class="md-settings-item">
                                    <label class="md-settings-label">
                                        <span>包含样式</span>
                                        <span class="md-settings-description">导出时包含 CSS 样式</span>
                                    </label>
                                    <div class="md-settings-control">
                                        <label class="md-switch">
                                            <input type="checkbox" id="setting-export-include-style" checked />
                                            <span class="md-switch-slider"></span>
                                        </label>
                                    </div>
                                </div>
                                <div class="md-settings-item">
                                    <label class="md-settings-label">
                                        <span>代码高亮</span>
