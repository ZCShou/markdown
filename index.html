<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>Markdown</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/src/styles/markdown.css">
</head>

<body>
    <!-- Status Display -->
    <div class="status-overlay" id="status-overlay"></div>
    <div class="status-message" id="status-message"></div>

    <!-- Sidebar Overlay (for mobile) -->
    <div class="md-sidebar-overlay" id="md-sidebar-overlay"></div>

    <!-- Main Layout Container - 横向布局 -->
    <div class="md-main-layout">
        <!-- Left Sidebar - Project Management -->
        <aside class="md-sidebar md-sidebar-left" id="md-sidebar-left">
            <div class="md-sidebar-header">
                <div class="md-sidebar-toolbar">
                    <button class="md-btn md-btn-icon" id="md-new-file" title="新建文件"><i class="codicon codicon-new-file"></i></button>
                    <button class="md-btn md-btn-icon" id="md-new-folder" title="新建目录"><i class="codicon codicon-new-folder"></i></button>
                    <button class="md-btn md-btn-icon" id="md-delete-item" title="清空所有文件"><i class="codicon codicon-clear-all"></i></button>
                </div>
                <button class="md-btn md-btn-icon md-btn-ghost" id="md-close-left-sidebar" title="关闭侧边栏"><i class="codicon codicon-close"></i></button>
            </div>
            <div class="md-sidebar-content">
                <div class="md-doc-list" id="md-doc-list">
                    <!-- Document list will be generated dynamically -->
                </div>
            </div>
        </aside>

        <!-- Middle Area - Toolbar + Container 垂直布局 -->
        <div class="md-middle-area">
            <!-- Top Toolbar -->
            <div class="markdown-toolbar">
                <div class="markdown-toolbar-left">
                    <button class="md-btn md-btn-icon md-btn-ghost" id="md-toggle-left-sidebar" title="项目管理"><i class="codicon codicon-folder-library"></i></button>
                    <button class="md-btn md-btn-icon md-btn-ghost" id="md-sync-scroll" title="同步滚动">
                        <i class="codicon codicon-sync"></i>
                    </button>
                </div>
                <div class="markdown-toolbar-right">
                    <button class="md-btn md-btn-icon md-btn-ghost" id="theme-toggle" title="切换主题">
                        <i class="codicon codicon-color-mode"></i>
                    </button>
                        <button class="md-btn md-btn-icon md-btn-ghost" id="md-layout-toggle" title="切换布局">
                            <i class="codicon codicon-layout"></i>
                        </button>
                    <button class="md-btn md-btn-icon md-btn-ghost" id="md-toggle-right-sidebar" title="功能面板"><i class="codicon codicon-menu"></i></button>
                </div>
            </div>

            <!-- Main Container -->
            <div class="markdown-container" id="md-container">
                <!-- Editor Pane -->
                <div class="markdown-editor-pane" id="md-editor-pane">
                    <div class="markdown-editor-wrapper">
                        <textarea id="markdown-editor" class="unified-scrollbar" placeholder="在此输入 Markdown 内容..."
                            spellcheck="false"></textarea>
                    </div>
                </div>

                <!-- Divider -->
                <div class="markdown-divider" id="md-divider"></div>

                <!-- Preview Pane -->
                <div class="markdown-preview-pane" id="md-preview-pane">
                    <div class="markdown-preview-wrapper unified-scrollbar" id="md-preview-wrapper">
                        <div id="markdown-preview" class="markdown-body "></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Sidebar - Tools -->
        <aside class="md-sidebar md-sidebar-right" id="md-sidebar-right">
            <div class="md-sidebar-header">
                <h3>工具</h3>
                <button class="md-btn md-btn-icon md-btn-ghost" id="md-close-right-sidebar" title="关闭侧边栏"><i class="codicon codicon-close"></i></button>
            </div>
            <div class="md-sidebar-content">
                <!-- TOC Section -->
                <div class="md-sidebar-section" id="md-toc-section">
                    <div class="md-sidebar-section-header">
                        <button class="md-sidebar-section-toggle" data-section="toc" title="折叠/展开"><i class="codicon codicon-chevron-right"></i></button>
                        <span class="md-sidebar-section-title">目录</span>
                    </div>
                    <div class="md-sidebar-section-content " id="md-toc-content">
                        <div class="unified-scrollbar">
                            <div class="md-toc" id="md-toc">
                                <!-- TOC will be generated dynamically -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Export Section -->
                <div class="md-sidebar-section" id="md-export-section">
                    <div class="md-sidebar-section-header">
                        <button class="md-sidebar-section-toggle" data-section="export" title="折叠/展开"><i class="codicon codicon-chevron-right"></i></button>
                        <span class="md-sidebar-section-title">导出</span>
                    </div>
                    <div class="md-sidebar-section-content" id="md-export-content">
                        <div class="md-btn-group">
                            <button class="md-btn md-btn-block" id="md-export-html">导出 HTML</button>
                            <button class="md-btn md-btn-block" id="md-export-md">导出 Markdown</button>
                            <button class="md-btn md-btn-block" id="md-export-pdf">导出 PDF</button>
                        </div>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <!-- Prism Themes -->
    <link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism.min.css" rel="stylesheet"
        id="prism-light-theme" />
    <link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet"
        id="prism-dark-theme" disabled />
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

    <script type="module" src="/src/main.js"></script>
</body>

</html>
