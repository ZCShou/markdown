<!doctype html>
<html lang="zh-CN" dir="ltr">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <meta name="referrer" content="no-referrer" />
        <meta
            name="description"
            content="功能强大的在线 Markdown 编辑器，支持实时预览、语法高亮、数学公式、流程图等"
        />
        <meta name="keywords" content="Markdown,编辑器,在线编辑,实时预览,语法高亮" />
        <meta name="author" content="Markdown Editor" />
        <meta name="theme-color" content="#ffffff" />
        <meta name="theme-color" content="#1e1e1e" media="(prefers-color-scheme: dark)" />
        <title>Markdown</title>
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="manifest" href="/manifest.json" />
        <link rel="stylesheet" href="/src/styles/markdown.css" />
    </head>

    <body>
        <!-- Status Display -->
        <div class="status-overlay" id="status-overlay"></div>
        <div class="status-message" id="status-message"></div>

        <!-- Sidebar Overlay (for mobile) -->
        <div class="md-sidebar-overlay" id="md-sidebar-overlay"></div>

        <!-- Main Layout Container - 横向布局 -->
        <div class="md-main-layout">
            <!-- Left Sidebar - Project Management -->
            <aside class="md-sidebar md-sidebar-left" id="md-sidebar-left">
                <div class="md-sidebar-header">
                    <div class="md-sidebar-toolbar" role="toolbar" aria-label="文档管理工具栏">
                        <button
                            class="md-btn md-btn-icon"
                            id="md-new-file"
                            title="新建文件"
                            aria-label="新建文件"
                        >
                            <i class="codicon codicon-new-file" aria-hidden="true"></i>
                        </button>
                        <button
                            class="md-btn md-btn-icon"
                            id="md-new-folder"
                            title="新建目录"
                            aria-label="新建目录"
                        >
                            <i class="codicon codicon-new-folder" aria-hidden="true"></i>
                        </button>
                        <button
                            class="md-btn md-btn-icon"
                            id="md-import-docs"
                            title="导入文档"
                            aria-label="导入文档"
                        >
                            <i class="codicon codicon-sign-in md-icon-rotate-90" aria-hidden="true"></i>
                        </button>
                        <button
                            class="md-btn md-btn-icon"
                            id="md-export-docs"
                            title="导出文档"
                            aria-label="导出文档"
                        >
                            <i class="codicon codicon-sign-out md-icon-rotate-90" aria-hidden="true"></i>
                        </button>
                        <button
                            class="md-btn md-btn-icon"
                            id="md-delete-item"
                            title="清空所有文件"
                            aria-label="清空所有文件"
                        >
                            <i class="codicon codicon-clear-all" aria-hidden="true"></i>
                        </button>
                    </div>
                    <button
                        class="md-btn md-btn-icon md-btn-ghost"
                        id="md-close-left-sidebar"
                        title="关闭侧边栏"
                    >
                        <i class="codicon codicon-close"></i>
                    </button>
                </div>
                <div class="md-sidebar-content">
                    <nav
                        class="md-doc-tree"
                        id="md-doc-tree"
                        role="navigation"
                        aria-label="文档树"
                    >
                        <!-- Document tree will be generated dynamically -->
                    </nav>
                </div>
            </aside>

            <!-- Middle Area - Toolbar + Container 垂直布局 -->
            <div class="md-middle-area">
                <!-- Top Toolbar -->
                <div class="markdown-toolbar">
                    <div class="markdown-toolbar-left">
                        <button
                            class="md-btn md-btn-icon md-btn-ghost"
                            id="md-toggle-left-sidebar"
                            title="项目管理"
                            aria-label="切换项目管理侧边栏"
                            aria-pressed="false"
                        >
                            <i class="codicon codicon-folder-library" aria-hidden="true"></i>
                        </button>
                        <button
                            class="md-btn md-btn-icon md-btn-ghost"
                            id="md-layout-toggle"
                            title="切换布局"
                            aria-label="切换编辑器布局"
                        >
                            <i class="codicon codicon-layout" aria-hidden="true"></i>
                        </button>
                        <button
                            class="md-btn md-btn-icon md-btn-ghost"
                            id="md-sync-scroll"
                            title="同步滚动"
                            aria-label="切换同步滚动"
                            aria-pressed="true"
                        >
                            <i class="codicon codicon-sync" aria-hidden="true"></i>
                        </button>
                    </div>
                    <div class="markdown-toolbar-right">
                        <button
                            class="md-btn md-btn-icon md-btn-ghost"
                            id="md-search-toggle-btn"
                            title="搜索 (Ctrl+F)"
                            aria-label="打开搜索面板"
                        >
                            <i class="codicon codicon-search" aria-hidden="true"></i>
                        </button>
                        <button
                            class="md-btn md-btn-icon md-btn-ghost"
                            id="theme-toggle"
                            title="切换主题"
                            aria-label="切换深色/浅色主题"
                        >
                            <i class="codicon codicon-color-mode" aria-hidden="true"></i>
                        </button>
                        <button
                            class="md-btn md-btn-icon md-btn-ghost"
                            id="md-settings-btn"
                            title="设置"
                            aria-label="打开设置"
                        >
                            <i class="codicon codicon-settings-gear" aria-hidden="true"></i>
                        </button>
                        <button
                            class="md-btn md-btn-icon md-btn-ghost"
                            id="md-toggle-right-sidebar"
                            title="功能面板"
                            aria-label="切换功能面板"
                            aria-pressed="false"
                        >
                            <i class="codicon codicon-menu" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                <!-- Main Container -->
                <div class="markdown-container" id="md-container">
                    <!-- Search & Replace Panel -->
                    <div class="md-search-replace-panel" id="md-search-replace-panel">
                        <div class="md-search-replace-content">
                            <button
                                class="md-btn md-btn-icon md-btn-ghost md-search-toggle"
                                id="md-search-toggle"
                                title="切换搜索/替换模式"
                            >
                                <i class="codicon codicon-chevron-right" aria-hidden="true"></i>
                            </button>
                            <div class="md-search-form">
                                <!-- 搜索行 -->
                                <div class="md-search-row">
                                    <div class="md-search-input-wrapper">
                                        <input
                                            type="text"
                                            id="md-search-input"
                                            class="md-search-input"
                                            placeholder="查找"
                                            aria-label="查找内容"
                                            spellcheck="false"
                                        />
                                        <div class="md-search-input-options">
                                            <button
                                                class="md-btn md-btn-icon md-btn-ghost md-search-option-btn"
                                                id="md-search-case"
                                                title="区分大小写"
                                                aria-label="区分大小写"
                                                aria-pressed="false"
                                            >
                                                <i class="codicon codicon-case-sensitive" aria-hidden="true"></i>
                                            </button>
                                            <button
                                                class="md-btn md-btn-icon md-btn-ghost md-search-option-btn"
                                                id="md-search-whole-word"
                                                title="全字匹配"
                                                aria-label="全字匹配"
                                                aria-pressed="false"
                                            >
                                                <i class="codicon codicon-whole-word" aria-hidden="true"></i>
                                            </button>
                                            <button
                                                class="md-btn md-btn-icon md-btn-ghost md-search-option-btn"
                                                id="md-search-regex"
                                                title="使用正则表达式"
                                                aria-label="使用正则表达式"
                                                aria-pressed="false"
                                            >
                                                <i class="codicon codicon-regex" aria-hidden="true"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <div class="md-search-match-info">
                                        <span id="md-search-match-count"></span>
                                    </div>
                                    <button
                                        class="md-btn md-btn-icon"
                                        id="md-search-prev"
                                        title="上一个 (Shift+Enter)"
                                        aria-label="上一个匹配"
                                    >
                                        <i class="codicon codicon-arrow-up" aria-hidden="true"></i>
                                    </button>
                                    <button
                                        class="md-btn md-btn-icon"
                                        id="md-search-next"
                                        title="下一个 (Enter)"
                                        aria-label="下一个匹配"
                                    >
                                        <i class="codicon codicon-arrow-down" aria-hidden="true"></i>
                                    </button>
                                    <button
                                        class="md-btn md-btn-icon md-btn-ghost md-search-close"
                                        id="md-search-close"
                                        title="关闭 (Esc)"
                                    >
                                        <i class="codicon codicon-close" aria-hidden="true"></i>
                                    </button>
                                </div>
                                
                                <!-- 替换行 -->
                                <div class="md-search-row md-replace-row">
                                    <div class="md-search-input-wrapper">
                                        <input
                                            type="text"
                                            id="md-replace-input"
                                            class="md-search-input"
                                            placeholder="替换"
                                            aria-label="替换内容"
                                            spellcheck="false"
                                        />
                                    </div>
                                    <div class="md-search-match-info"></div>
                                    <button
                                        class="md-btn md-btn-icon"
                                        id="md-replace-one"
                                        title="替换当前 (Enter)"
                                        aria-label="替换当前匹配"
                                    >
                                        <i class="codicon codicon-replace" aria-hidden="true"></i>
                                    </button>
                                    <button
                                        class="md-btn md-btn-icon"
                                        id="md-replace-all"
                                        title="全部替换"
                                        aria-label="全部替换"
                                    >
                                        <i class="codicon codicon-replace-all" aria-hidden="true"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Editor Pane -->
                    <div class="markdown-editor-pane" id="md-editor-pane">
                        <div class="markdown-editor-wrapper">
                            <textarea
                                id="markdown-editor"
                                class="unified-scrollbar"
                                placeholder="在此输入 Markdown 内容..."
                                aria-label="Markdown 编辑器输入区域"
                                spellcheck="false"
                                role="textbox"
                                aria-multiline="true"
                            ></textarea>
                        </div>
                    </div>

                    <!-- Divider -->
                    <div class="markdown-divider" id="md-divider"></div>

                    <!-- Preview Pane -->
                    <div class="markdown-preview-pane" id="md-preview-pane">
                        <div
                            class="markdown-preview-wrapper unified-scrollbar"
                            id="md-preview-wrapper"
                        >
                            <div
                                id="markdown-preview"
                                class="markdown-body"
                                role="article"
                                aria-label="Markdown 预览区域"
                                aria-live="polite"
                            ></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Sidebar - Tools -->
            <aside class="md-sidebar md-sidebar-right" id="md-sidebar-right">
                <div class="md-sidebar-header">
                    <h3>工具</h3>
                    <button
                        class="md-btn md-btn-icon md-btn-ghost"
                        id="md-close-right-sidebar"
                        title="关闭侧边栏"
                    >
                        <i class="codicon codicon-close"></i>
                    </button>
                </div>
                <div class="md-sidebar-content">
                    <!-- TOC Section -->
                    <div class="md-sidebar-section" id="md-toc-section">
                        <div class="md-sidebar-section-header">
                            <button
                                class="md-sidebar-section-toggle"
                                data-section="toc"
                                title="折叠/展开"
                            >
                                <i class="codicon codicon-chevron-right"></i>
                            </button>
                            <span class="md-sidebar-section-title">目录</span>
                        </div>
                        <div class="md-sidebar-section-content" id="md-toc-content">
                            <div class="unified-scrollbar">
                                <div class="md-toc" id="md-toc">
                                    <!-- TOC will be generated dynamically -->
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Export Section -->
                    <div class="md-sidebar-section" id="md-export-section">
                        <div class="md-sidebar-section-header">
                            <button
                                class="md-sidebar-section-toggle"
                                data-section="export"
                                title="折叠/展开"
                            >
                                <i class="codicon codicon-chevron-right"></i>
                            </button>
                            <span class="md-sidebar-section-title">导出</span>
                        </div>
                        <div class="md-sidebar-section-content" id="md-export-content">
                            <div class="md-btn-group">
                                <button class="md-btn md-btn-block" id="md-export-html">
                                    导出 HTML
                                </button>
                                <button class="md-btn md-btn-block" id="md-export-md">
                                    导出 Markdown
                                </button>
                                <button class="md-btn md-btn-block" id="md-export-pdf">
                                    导出 PDF
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </aside>
        </div>

        <!-- Settings Dialog -->
        <div class="md-settings-overlay" id="md-settings-overlay">
            <div class="md-settings-dialog">
                <div class="md-settings-header">
                    <h2>设置</h2>
                    <button class="md-btn md-btn-icon md-btn-ghost" id="md-settings-close" title="关闭">
                        <i class="codicon codicon-close"></i>
                    </button>
                </div>
                <div class="md-settings-content">
                    <!-- Left Navigation -->
                    <div class="md-settings-nav unified-scrollbar">
                        <div class="md-settings-nav-item active" data-section="basic" title="基本配置">
                            <i class="codicon codicon-settings-gear md-settings-nav-item-icon"></i>
                            <span class="md-settings-nav-item-text">基本配置</span>
                        </div>
                        <div class="md-settings-nav-item" data-section="interface" title="界面设置">
                            <i class="codicon codicon-layout md-settings-nav-item-icon"></i>
                            <span class="md-settings-nav-item-text">界面设置</span>
                        </div>
                        <div class="md-settings-nav-item" data-section="export" title="导出配置">
                            <i class="codicon codicon-export md-settings-nav-item-icon"></i>
                            <span class="md-settings-nav-item-text">导出配置</span>
                        </div>
                    </div>
                    <!-- Right Content -->
                    <div class="md-settings-body unified-scrollbar">
                        <!-- Basic Settings -->
                        <div class="md-settings-section active" id="settings-basic">
                            <div class="md-settings-group">
                                <h4>编辑器设置</h4>
                                <div class="md-settings-item">
                                    <label class="md-settings-label">
                                        <span>字体大小</span>
                                        <span class="md-settings-description">设置编辑器字体大小</span>
                                    </label>
                                    <div class="md-settings-control">
                                        <input type="number" id="setting-font-size" value="14" min="10" max="24" />
                                        <span class="md-settings-unit">px</span>
                                    </div>
                                </div>
                                <div class="md-settings-item">
                                    <label class="md-settings-label">
                                        <span>行高</span>
                                        <span class="md-settings-description">设置编辑器行高</span>
                                    </label>
                                    <div class="md-settings-control">
                                        <input type="number" id="setting-line-height" value="1.6" min="1.0" max="2.5" step="0.1" />
                                    </div>
                                </div>
                                <div class="md-settings-item">
                                    <label class="md-settings-label">
                                        <span>自动保存</span>
                                        <span class="md-settings-description">编辑时自动保存文档</span>
                                    </label>
                                    <div class="md-settings-control">
                                        <label class="md-switch">
                                            <input type="checkbox" id="setting-auto-save" checked />
                                            <span class="md-switch-slider"></span>
                                        </label>
                                    </div>
                                </div>
                                <div class="md-settings-item">
                                    <label class="md-settings-label">
                                        <span>使用空格代替 TAB</span>
                                        <span class="md-settings-description">按 TAB 键时插入空格而非制表符</span>
                                    </label>
                                    <div class="md-settings-control">
                                        <label class="md-switch">
                                            <input type="checkbox" id="setting-insert-spaces" checked />
                                            <span class="md-switch-slider"></span>
                                        </label>
                                    </div>
                                </div>
                                <div class="md-settings-item">
                                    <label class="md-settings-label">
                                        <span>TAB 大小</span>
                                        <span class="md-settings-description">TAB 键对应的空格数量</span>
                                    </label>
                                    <div class="md-settings-control">
                                        <input type="number" id="setting-tab-size" value="4" min="2" max="8" />
                                        <span class="md-settings-unit">空格</span>
                                    </div>
                                </div>
                            </div>
                            <div class="md-settings-group">
                                <h4>主题设置</h4>
                                <div class="md-settings-item">
                                    <label class="md-settings-label">
                                        <span>主题模式</span>
                                        <span class="md-settings-description">选择界面主题</span>
                                    </label>
                                    <div class="md-settings-control">
                                        <select id="setting-theme">
                                            <option value="light">浅色主题</option>
                                            <option value="dark">深色主题</option>
                                            <option value="auto">跟随系统</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- Interface Settings -->
                        <div class="md-settings-section" id="settings-interface">
                            <div class="md-settings-group">
                                <h4>布局设置</h4>
                                <div class="md-settings-item">
                                    <label class="md-settings-label">
                                        <span>布局模式</span>
                                        <span class="md-settings-description">选择编辑器布局模式</span>
                                    </label>
                                    <div class="md-settings-control">
                                        <select id="setting-layout">
                                            <option value="layout-both">双栏布局</option>
                                            <option value="layout-editor-only">仅编辑</option>
                                            <option value="layout-preview-only">仅预览</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="md-settings-item">
                                    <label class="md-settings-label">
                                        <span>编辑器宽度比例</span>
                                        <span class="md-settings-description">调整编辑器与预览的宽度比例</span>
                                    </label>
                                    <div class="md-settings-control">
                                        <input type="range" id="setting-left-ratio" value="50" min="20" max="80" step="5" />
                                        <span class="md-settings-value" id="setting-left-ratio-value">50%</span>
                                    </div>
                                </div>
                            </div>
                            <div class="md-settings-group">
                                <h4>侧边栏设置</h4>
                                <div class="md-settings-item">
                                    <label class="md-settings-label">
                                        <span>默认打开左侧边栏</span>
                                        <span class="md-settings-description">启动时自动打开左侧边栏</span>
                                    </label>
                                    <div class="md-settings-control">
                                        <label class="md-switch">
                                            <input type="checkbox" id="setting-left-sidebar-open" />
                                            <span class="md-switch-slider"></span>
                                        </label>
                                    </div>
                                </div>
                                <div class="md-settings-item">
                                    <label class="md-settings-label">
                                        <span>默认打开右侧边栏</span>
                                        <span class="md-settings-description">启动时自动打开右侧边栏</span>
                                    </label>
                                    <div class="md-settings-control">
                                        <label class="md-switch">
                                            <input type="checkbox" id="setting-right-sidebar-open" />
                                            <span class="md-switch-slider"></span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                            <div class="md-settings-group">
                                <h4>侧边栏区块</h4>
                                <div class="md-settings-item">
                                    <label class="md-settings-label">
                                        <span>显示目录</span>
                                        <span class="md-settings-description">在侧边栏中显示文档目录</span>
                                    </label>
                                    <div class="md-settings-control">
                                        <label class="md-switch">
                                            <input type="checkbox" id="setting-section-toc" checked />
                                            <span class="md-switch-slider"></span>
                                        </label>
                                    </div>
                                </div>
                                <div class="md-settings-item">
                                    <label class="md-settings-label">
                                        <span>显示导出选项</span>
                                        <span class="md-settings-description">在侧边栏中显示导出选项</span>
                                    </label>
                                    <div class="md-settings-control">
                                        <label class="md-switch">
                                            <input type="checkbox" id="setting-section-export" checked />
                                            <span class="md-switch-slider"></span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                            <div class="md-settings-group">
                                <h4>编辑器同步</h4>
                                <div class="md-settings-item">
                                    <label class="md-settings-label">
                                        <span>同步滚动</span>
                                        <span class="md-settings-description">编辑器与预览窗口同步滚动</span>
                                    </label>
                                    <div class="md-settings-control">
                                        <label class="md-switch">
                                            <input type="checkbox" id="setting-sync-scroll-enabled" checked />
                                            <span class="md-switch-slider"></span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- Export Settings -->
                        <div class="md-settings-section" id="settings-export">
                            <div class="md-settings-group">
                                <h4>HTML 导出</h4>
                                <div class="md-settings-item">
                                    <label class="md-settings-label">
                                        <span>包含样式</span>
                                        <span class="md-settings-description">导出时包含 CSS 样式</span>
                                    </label>
                                    <div class="md-settings-control">
                                        <label class="md-switch">
                                            <input type="checkbox" id="setting-export-include-style" checked />
                                            <span class="md-switch-slider"></span>
                                        </label>
                                    </div>
                                </div>
                                <div class="md-settings-item">
                                    <label class="md-settings-label">
                                        <span>代码高亮</span>
                                        <span class="md-settings-description">导出时保留代码高亮</span>
                                    </label>
                                    <div class="md-settings-control">
                                        <label class="md-switch">
                                            <input type="checkbox" id="setting-export-code-highlight" checked />
                                            <span class="md-switch-slider"></span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                            <div class="md-settings-group">
                                <h4>PDF 导出</h4>
                                <div class="md-settings-item">
                                    <label class="md-settings-label">
                                        <span>页面大小</span>
                                        <span class="md-settings-description">选择 PDF 页面大小</span>
                                    </label>
                                    <div class="md-settings-control">
                                        <select id="setting-pdf-size">
                                            <option value="A4">A4</option>
                                            <option value="Letter">Letter</option>
                                            <option value="Legal">Legal</option>
                                        </select>
                                    </div>
                                </div>
